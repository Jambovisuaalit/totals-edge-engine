name: XGBoost one-prediction smoke test

on:
  pull_request:
    paths:
      - "smoke_test_prediction.py"
      - "requirements-smoke.txt"
      - ".github/workflows/xgboost-smoke.yml"

permissions:
  contents: read

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-smoke.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-smoke.txt
      - name: Run one held-out XGBoost prediction
        run: python smoke_test_prediction.py | tee prediction.log
      - name: Upload prediction output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xgboost-smoke-prediction
          path: prediction.log
